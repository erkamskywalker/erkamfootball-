<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ErkamFootball - Life & Career</title>
<style>
:root { --p: #22c55e; --bg: #0f172a; --card: #1e293b; }
body{ background: var(--bg); color:white; font-family: 'Segoe UI', sans-serif; margin:0; user-select: none; overflow-x: hidden; }
.container{ max-width:600px; margin:auto; padding: 20px; }
.card{ background: var(--card); padding:20px; border-radius:16px; margin-bottom:15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
button{ padding:12px; border:none; border-radius:10px; cursor:pointer; background: var(--p); color:white; font-weight:bold; transition: 0.2s; }
button:hover{ transform: scale(1.03); opacity: 0.9; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.stat{ background: #334155; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.9rem; }
.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.shop-item { background: #334155; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #475569; }
.shop-item img { font-size: 2rem; display: block; margin-bottom: 10px; }

/* Maç Ekranı Katmanı */
#matchOverlay { 
    display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
    background: #064e3b; z-index: 1000; flex-direction: column; align-items: center; justify-content: center;
}
#gameCanvas { background: #15803d; border: 5px solid white; border-radius: 12px; touch-action: none; max-width: 90vw; }

.tab-btn { background: #334155; flex: 1; margin: 0 5px; }
.tab-active { background: var(--p); }
.nav { display: flex; margin-bottom: 20px; }

.owned-badge { font-size: 0.7rem; background: var(--p); padding: 2px 6px; border-radius: 4px; margin-top: 5px; display: inline-block; }
</style>
</head>
<body>

<div id="mainUI" class="container">
    <h1 style="text-align:center; color:var(--p);">⚽ ErkamFootball</h1>

    <div id="createScreen" class="card">
        <h2>Yeni Kariyer</h2>
        <input id="name" placeholder="Oyuncu Adı" style="width:100%; padding:10; margin-bottom:10px; border-radius:5px; border:none;">
        <button onclick="createPlayer()" style="width:100%">Kariyere Başla</button>
    </div>

    <div id="gameScreen" style="display:none;">
        <!-- Header Karakter -->
        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <h2 id="playerName" style="margin:0"></h2>
                <span id="playerClub" style="color:var(--p); font-weight:bold;"></span>
            </div>
            <div class="stat-grid">
                <div class="stat">⚡ Hız: <b id="speed"></b></div>
                <div class="stat">🎯 Şut: <b id="shoot"></b></div>
            </div>
            <div style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px; margin-top:10px;">
                💰 Banka: <b id="money" style="color:#fbbf24"></b><br>
                📅 Hafta: <b id="matchWeek"></b> / 50
            </div>
        </div>

        <!-- Sekmeler -->
        <div class="nav">
            <button class="tab-btn tab-active" onclick="showTab('career')">Kariyer</button>
            <button class="tab-btn" onclick="showTab('shop')">Mağaza</button>
            <button class="tab-btn" onclick="showTab('assets')">Mülklerim</button>
        </div>

        <!-- Kariyer Sekmesi -->
        <div id="tab-career">
            <div class="card">
                <h3>Sıradaki Etkinlik</h3>
                <button onclick="startMatch()" style="width:100%; background:#3b82f6; margin-bottom:10px;">🏟️ MAÇA ÇIK</button>
                <button onclick="train()" style="width:100%; background:#6366f1;">🏋️ ANTRENMAN YAP</button>
            </div>
            <div class="card">
                <h3>Haberler</h3>
                <div id="log" style="font-size:0.8rem; color:#cbd5e1; max-height:80px; overflow-y:auto;"></div>
            </div>
        </div>

        <!-- Mağaza Sekmesi -->
        <div id="tab-shop" style="display:none;">
            <div class="shop-grid" id="shopItems"></div>
        </div>

        <!-- Mülkler Sekmesi -->
        <div id="tab-assets" style="display:none;">
            <div class="card">
                <h3>Satın Alınanlar</h3>
                <div id="inventoryList">Henüz bir şey almadın.</div>
            </div>
        </div>
    </div>
</div>

<!-- MAÇ EKRANI (FULLSCREEN) -->
<div id="matchOverlay">
    <div id="matchScore" style="font-size:1.5rem; font-weight:bold; margin-bottom:10px;">POZİSYON</div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div id="matchFeedback" style="color:#fbbf24; margin-top:10px; font-weight:bold;"></div>
    <p style="font-size:0.8rem; opacity:0.7;">Topu geriye çekip fırlat!</p>
</div>

<script>
let player = null;
let inventory = [];
const items = [
    { id:1, n: "Enerji İçeceği", p: 500, i: "🥤" },
    { id:2, n: "Yeni Krampon", p: 2000, i: "👟" },
    { id:3, n: "Oyun Konsolu", p: 5000, i: "🎮" },
    { id:4, n: "Tofaş Doğan SLX", p: 15000, i: "🚗" },
    { id:5, n: "Rolex Saat", p: 45000, i: "⌚" },
    { id:6, n: "BMW M4", p: 120000, i: "🚙" },
    { id:7, n: "Lüks Daire", p: 500000, i: "🏢" },
    { id:8, n: "Porsche 911", p: 950000, i: "🏎️" },
    { id:9, n: "Yüzme Havuzlu Villa", p: 2500000, i: "🏡" },
    { id:10, n: "Lamborghini", p: 5000000, i: "🏎️" },
    { id:11, n: "Özel Yat", p: 12000000, i: "🛥️" },
    { id:12, n: "Malikane", p: 35000000, i: "🏰" },
    { id:13, n: "Özel Jet", p: 100000000, i: "🛩️" },
    { id:14, n: "Futbol Kulübü", p: 500000000, i: "🏟️" },
    { id:15, n: "Ada Satın Al", p: 1000000000, i: "🏝️" }
];

let canvas, ctx, isDragging = false, dragStart = {}, dragCurrent = {};
let ball = { x: 200, y: 400, r: 10, vx: 0, vy: 0, active: false };
let goal = { x: 100, y: 30, w: 200, h: 20 };
let currentStep = 0, successCount = 0;

function createPlayer() {
    player = { 
        name: document.getElementById("name").value || "Erkam", 
        money: 5000, speed: 50, shoot: 50, week: 1, club: "Altyapı", salary: 1500 
    };
    document.getElementById("createScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    canvas = document.getElementById("gameCanvas"); ctx = canvas.getContext("2d");
    initControls(); renderShop(); updateUI();
}

function updateUI() {
    document.getElementById("playerName").innerText = player.name;
    document.getElementById("playerClub").innerText = player.club;
    document.getElementById("money").innerText = "€" + player.money.toLocaleString();
    document.getElementById("speed").innerText = player.speed;
    document.getElementById("shoot").innerText = player.shoot;
    document.getElementById("matchWeek").innerText = player.week;
}

function showTab(tab) {
    ["career", "shop", "assets"].forEach(t => document.getElementById("tab-"+t).style.display = (t===tab?'block':'none'));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("tab-active", b.innerText.toLowerCase().includes(tab === 'assets' ? 'mülk' : tab)));
}

function renderShop() {
    let html = "";
    items.forEach(item => {
        let owned = inventory.includes(item.id);
        html += `<div class="shop-item">
            <span>${item.i}</span>
            <div style="font-weight:bold; margin:5px 0;">${item.n}</div>
            <div style="color:#22c55e; font-size:0.9rem;">€${item.p.toLocaleString()}</div>
            <button onclick="buyItem(${item.id})" style="width:100%; margin-top:10px; font-size:0.8rem;" ${owned?'disabled':''}>
                ${owned ? 'Satın Alındı' : 'Satın Al'}
            </button>
        </div>`;
    });
    document.getElementById("shopItems").innerHTML = html;
}

function buyItem(id) {
    let item = items.find(i => i.id === id);
    if (player.money >= item.p) {
        player.money -= item.p;
        inventory.push(id);
        log(`Satın alındı: ${item.n}`);
        renderShop(); renderInventory(); updateUI();
    } else { alert("Yetersiz bakiye!"); }
}

function renderInventory() {
    let list = inventory.map(id => {
        let item = items.find(i => i.id === id);
        return `<div class="stat" style="margin-bottom:5px;">${item.i} ${item.n}</div>`;
    }).join("");
    document.getElementById("inventoryList").innerHTML = list || "Henüz bir şey almadın.";
}

function train() {
    player.speed += 2; player.shoot += 2; player.week++;
    player.money += player.salary;
    log("Antrenman yapıldı, yetenekler arttı!");
    if(player.week > 50) resetSeason();
    updateUI();
}

function startMatch() {
    document.getElementById("matchOverlay").style.display = "flex";
    currentStep = 0; successCount = 0;
    resetBall();
    gameLoop();
}

function resetBall() {
    ball.x = 200; ball.y = 420; ball.vx = 0; ball.vy = 0; ball.active = false;
}

function gameLoop() {
    if(ball.active) {
        ball.x += ball.vx; ball.y += ball.vy;
        ball.vx *= 0.98; ball.vy *= 0.98;
        if(ball.y <= goal.y + goal.h) {
            if(ball.x > goal.x && ball.x < goal.x + goal.w) { successCount++; document.getElementById("matchFeedback").innerText = "GOOOL!"; }
            else { document.getElementById("matchFeedback").innerText = "DIŞARI!"; }
            ball.active = false;
            setTimeout(() => {
                currentStep++;
                if(currentStep < 3) { resetBall(); document.getElementById("matchFeedback").innerText = ""; }
                else { endMatch(); }
            }, 1000);
        }
    }
    draw();
    if(document.getElementById("matchOverlay").style.display === "flex") requestAnimationFrame(gameLoop);
}

function draw() {
    ctx.clearRect(0,0,400,500);
    ctx.fillStyle = "white"; ctx.fillRect(goal.x, goal.y, goal.w, goal.h); // Kale
    if(isDragging) {
        ctx.beginPath(); ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + (dragStart.x - dragCurrent.x), ball.y + (dragStart.y - dragCurrent.y));
        ctx.strokeStyle = "yellow"; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fillStyle="white"; ctx.fill();
}

function endMatch() {
    document.getElementById("matchOverlay").style.display = "none";
    let gain = successCount * 500;
    player.money += (player.salary + gain);
    player.week++;
    log(`Maç bitti. ${successCount} gol attın. €${gain} prim kazandın!`);
    if(player.week > 50) resetSeason();
    updateUI();
}

function log(msg) {
    let l = document.getElementById("log");
    l.innerHTML = `> ${msg}<br>` + l.innerHTML;
}

function initControls() {
    const getPos = e => {
        let r = canvas.getBoundingClientRect();
        let c = e.touches ? e.touches[0] : e;
        return { x: (c.clientX - r.left) * (400/r.width), y: (c.clientY - r.top) * (500/r.height) };
    };
    canvas.addEventListener("mousedown", e => { let p = getPos(e); if(Math.hypot(p.x-ball.x, p.y-ball.y)<30){ isDragging=true; dragStart=p; dragCurrent=p; } });
    window.addEventListener("mousemove", e => { if(isDragging) dragCurrent=getPos(e); });
    window.addEventListener("mouseup", () => {
        if(isDragging){
            ball.vx = (dragStart.x - dragCurrent.x) * 0.15; ball.vy = (dragStart.y - dragCurrent.y) * 0.15;
            ball.active = true; isDragging = false;
        }
    });
    canvas.addEventListener("touchstart", e => { let p = getPos(e); if(Math.hypot(p.x-ball.x, p.y-ball.y)<30){ isDragging=true; dragStart=p; dragCurrent=p; } });
    window.addEventListener("touchmove", e => { if(isDragging) dragCurrent=getPos(e); });
    window.addEventListener("touchend", () => {
        if(isDragging){
            ball.vx = (dragStart.x - dragCurrent.x) * 0.15; ball.vy = (dragStart.y - dragCurrent.y) * 0.15;
            ball.active = true; isDragging = false;
        }
    });
}
</script>
</body>
</html>
